[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
kotlinxCoroutinesAndroid = "1.11.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
composeBom = "2026.02.01"
lifecycleViewmodelCompose = "2.11.0"
materialIconsCore = "1.7.8"
okhttp = "5.4.0"
roomRuntime = "2.8.4"
nav3Core = "1.1.4"
lifecycleViewmodelNav3 = "2.11.0"
